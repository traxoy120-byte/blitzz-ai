<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitz AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: url("https://www.itstactical.com/wp-content/uploads/2013/07/night-sky-jeff-m-1024.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      overflow: hidden;
    }

    body *:not(html):not(body) {
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #chat-container {
      position: absolute;
      top: 20px;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      overflow-y: auto;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    #chat-input {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: calc(100% - 120px);
      max-width: 500px;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .toggle-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s ease;
    }

    .switch input:checked + .slider {
      background-color: rgba(0, 255, 0, 0.5);
    }

    .switch input:checked + .slider:before {
      transform: translateX(24px);
    }
  </style>
</head>
<body>
  <div id="chat-container"></div>
  <input id="chat-input" type="text" placeholder="Ask Blitz AI something..." />
  <div class="toggle-wrapper">
    <label class="switch">
      <input type="checkbox" id="search-toggle" checked />
      <span class="slider"></span>
    </label>
    <span>Search</span>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatInput = document.getElementById("chat-input");
    const searchToggle = document.getElementById("search-toggle");

    let isTyping = false;

    chatInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && chatInput.value.trim() && !isTyping) {
        const prompt = chatInput.value.trim();
        chatInput.value = "";
        isTyping = true;

        appendMessage("You", prompt);
        const reply = generateResponse(prompt, searchToggle.checked);
        await typeReply("Blitz AI", reply);

        isTyping = false;
      }
    });

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msg.style.marginBottom = "12px";
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function typeReply(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> <span></span>`;
      msg.style.marginBottom = "12px";
      chatContainer.appendChild(msg);

      const span = msg.querySelector("span");
      for (let i = 0; i < text.length; i++) {
        span.textContent += text[i];
        await new Promise(r => setTimeout(r, 18));
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function generateResponse(prompt, searchEnabled) {
      const words = prompt.split(/\s+/);
      const base = searchEnabled
        ? `🔎 Searching for "${prompt}"... `
        : `Thinking about "${prompt}"... `;

      let response = base;

      for (let i = 0; i < words.length; i++) {
        const word = words[i];
        response += `The concept of "${word}" often leads to questions about `;
        response += i % 2 === 0 ? "perspective, " : "context, ";
      }

      response += "which we can explore together.";
      return response;
    }
  </script>
</body>
</html>
