<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitz AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      background: url("https://www.itstactical.com/wp-content/uploads/2013/07/night-sky-jeff-m-1024.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      overflow: hidden;
    }

    #chat-container {
      position: absolute;
      top: 20px;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      overflow-y: auto;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    #chat-input {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .typed span {
      opacity: 0;
      animation: fadeIn 0.3s ease-in forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="chat-container"></div>
  <input id="chat-input" type="text" placeholder="Ask Blitz AI something..." />

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatInput = document.getElementById("chat-input");

    let isTyping = false;

    chatInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && chatInput.value.trim() && !isTyping) {
        const prompt = chatInput.value.trim();
        appendMessage("You", prompt);
        chatInput.value = "";
        isTyping = true;

        const reply = getSmartReply(prompt);
        await typeReply("Blitz AI", reply);

        isTyping = false;
      }
    });

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msg.style.marginBottom = "12px";
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function typeReply(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> <span class="typed"></span>`;
      msg.style.marginBottom = "12px";
      chatContainer.appendChild(msg);

      const typedSpan = msg.querySelector(".typed");
      for (let i = 0; i < text.length; i++) {
        const char = document.createElement("span");
        char.textContent = text[i];
        typedSpan.appendChild(char);
        await new Promise(r => setTimeout(r, 18));
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function getSmartReply(prompt) {
      const lower = prompt.toLowerCase();

      if (lower.includes("hello") || lower.includes("hi")) {
        return "Hey there. What’s on your mind?";
      }

      if (lower.includes("who are you")) {
        return "I'm Blitz AI — your cozy, clever companion for ideas, questions, and deep thoughts.";
      }

      if (lower.includes("meaning of life")) {
        return "Some say 42. I say: to create, to connect, to wonder. What’s your take?";
      }

      if (lower.includes("help") || lower.includes("stuck")) {
        return "Let’s untangle it together. What’s the problem you’re facing?";
      }

      return "Hmm… that’s interesting. Tell me more about what you’re thinking.";
    }
  </script>
</body>
</html>
