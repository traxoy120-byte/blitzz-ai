<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitz AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      background: url("https://www.itstactical.com/wp-content/uploads/2013/07/night-sky-jeff-m-1024.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      overflow: hidden;
    }

    body *:not(html):not(body) {
      animation: slideDown 0.4s ease-out;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-10px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    #chat-container {
      position: absolute;
      top: 20px;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      overflow-y: auto;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
    }

    #chat-input {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: calc(100% - 120px);
      max-width: 500px;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .fade-in {
      opacity: 0;
      transition: opacity 0.4s ease-in;
    }

    .fade-in.visible {
      opacity: 1;
    }

    .toggle-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s ease;
    }

    .switch input:checked + .slider {
      background-color: rgba(0, 255, 0, 0.5);
    }

    .switch input:checked + .slider:before {
      transform: translateX(24px);
    }
  </style>
</head>
<body>
  <div id="chat-container"></div>
  <input id="chat-input" type="text" placeholder="Ask Blitz AI something..." />

  <div class="toggle-wrapper">
    <label class="switch">
      <input type="checkbox" id="search-toggle" checked />
      <span class="slider"></span>
    </label>
    <span>Search</span>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatInput = document.getElementById("chat-input");
    const searchToggle = document.getElementById("search-toggle");

    let isResponding = false;

    chatInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && chatInput.value.trim() && !isResponding) {
        const prompt = chatInput.value.trim();
        chatInput.value = "";
        isResponding = true;

        const searchEnabled = searchToggle.checked;
        const reply = getSmartReply(prompt, searchEnabled);

        if (reply.startsWith("🔎")) {
          showReply("Blitz AI", reply);
          appendMessage("You", prompt);
        } else {
          appendMessage("You", prompt);
          showReply("Blitz AI", reply);
        }

        isResponding = false;
      }
    });

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msg.style.marginBottom = "12px";
      msg.classList.add("fade-in");
      chatContainer.appendChild(msg);
      requestAnimationFrame(() => msg.classList.add("visible"));
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showReply(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msg.style.marginBottom = "12px";
      msg.classList.add("fade-in");
      chatContainer.insertBefore(msg, chatContainer.lastElementChild);
      requestAnimationFrame(() => msg.classList.add("visible"));
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function getSmartReply(prompt, searchEnabled) {
      const lower = prompt.toLowerCase();

      if (searchEnabled && /(who|what|when|where|why|how|latest|news|define|meaning of)/.test(lower)) {
        const fakeResult = [
          `According to recent sources, "${prompt}" refers to a concept gaining traction in multiple fields.`,
          `"${prompt}" is often discussed in the context of emerging technologies and social dynamics.`,
          `Here's what I found: "${prompt}" is a term used in modern discourse around innovation.`,
          `Quick search result: "${prompt}" is defined as a key idea in current thought.`,
          `Based on simulated data, "${prompt}" is trending in academic and creative circles.`
        ];
        return "🔎 " + fakeResult[Math.floor(Math.random() * fakeResult.length)];
      }

      const openers = [
        "That's a great question.",
        "Interesting thought.",
        "Let’s explore that.",
        "You’ve touched on something deep.",
        "I like where you're going with this."
      ];

      const insights = [
        "Sometimes the answer depends on context and intention.",
        "There’s more than one way to interpret that.",
        "It might help to reframe the question.",
        "This could be a matter of perspective.",
        "Let’s break it down and see what emerges."
      ];

      const followUps = [
        "What do you think about that?",
        "Does that resonate with you?",
        "Want to go deeper?",
        "Should we explore another angle?",
        "Let’s keep going if you're curious."
      ];

      const intro = openers[Math.floor(Math.random() * openers.length)];
      const insight = insights[Math.floor(Math.random() * insights.length)];
      const follow = followUps[Math.floor(Math.random() * followUps.length)];

      return `${intro} ${insight} ${follow}`;
    }
  </script>
</body>
</html>
