<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitz AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      background: url("https://www.itstactical.com/wp-content/uploads/2013/07/night-sky-jeff-m-1024.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      animation: bounceIn 0.6s ease-out;
    }

    @keyframes bounceIn {
      0% { transform: translateY(5px); opacity: 0; }
      50% { transform: translateY(-5px); opacity: 1; }
      100% { transform: translateY(0); }
    }

    @keyframes respondBounce {
      0% { transform: translateY(5px); opacity: 0; }
      50% { transform: translateY(-5px); opacity: 1; }
      100% { transform: translateY(0); }
    }

    .respond-bounce {
      animation: respondBounce 0.5s ease-out;
    }

    #greeting {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      font-weight: 700;
      color: white;
      text-align: center;
    }

    #chat-container {
      position: absolute;
      top: 60px;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      overflow-y: auto;
      padding: 0 20px;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }

    #chat-container::-webkit-scrollbar {
      width: 6px;
    }

    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    #chat-input {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      padding: 14px 18px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .toggle-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      transition: 0.3s ease;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s ease;
    }

    .switch input:checked + .slider {
      background-color: rgba(0, 255, 0, 0.5);
    }

    .switch input:checked + .slider:before {
      transform: translateX(24px);
    }

    .message {
      margin-bottom: 12px;
    }

    .message strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="greeting">Hello, how can I help you with today?</div>
  <div id="chat-container"></div>
  <input id="chat-input" type="text" placeholder="Ask Blitz.AI something..." />
  <div class="toggle-wrapper">
    <label class="switch">
      <input type="checkbox" id="search-toggle" checked />
      <span class="slider"></span>
    </label>
    <span>Search</span>
  </div>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatInput = document.getElementById("chat-input");
    const searchToggle = document.getElementById("search-toggle");

    let isTyping = false;

    chatInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && chatInput.value.trim() && !isTyping) {
        const prompt = chatInput.value.trim();
        chatInput.value = "";
        isTyping = true;

        appendMessage("You", prompt);
        const reply = generateFromPrompt(prompt, searchToggle.checked);
        await typeReply("Blitz AI", reply);

        isTyping = false;
      }
    });

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = "message";
      msg.innerHTML = `<strong>${sender}:</strong>${text}`;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function typeReply(sender, text) {
      const msg = document.createElement("div");
      msg.className = "message";
      const span = document.createElement("span");
      msg.innerHTML = `<strong>${sender}:</strong> `;
      msg.appendChild(span);
      chatContainer.appendChild(msg);

      for (let i = 0; i < text.length; i++) {
        span.textContent += text[i];
        await new Promise(r => setTimeout(r, 18));
      }

      msg.classList.add("respond-bounce");
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function generateFromPrompt(prompt, searchEnabled) {
      const words = prompt.trim().split(/\s+/);
      let response = "";

      if (searchEnabled) {
        response += `🔎 Searching for "${prompt}"...\n`;
        response += `The term "${words[0]}" is often discussed in relation to `;
        response += words.slice(1).length ? words.slice(1).join(", ") : "various topics";
        response += `. It appears in recent articles and discussions, suggesting its relevance in evolving contexts.`;
      } else {
        response += `Let’s explore "${prompt}". `;
        response += `When we consider "${words[0]}", it often leads to thoughts about `;
        response += words.slice(1).length ? words.slice(1).join(", ") : "broader ideas";
        response += `. This opens up new ways to reflect and explore.`;
      }

      return response;
    }
  </script>
</body>
</html>
