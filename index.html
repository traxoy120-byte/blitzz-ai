<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blitz AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      background: url("https://www.itstactical.com/wp-content/uploads/2013/07/night-sky-jeff-m-1024.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      overflow: hidden;
    }

    * {
      font-smooth: always;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #welcome {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      font-size: 20px;
      font-weight: 500;
    }

    #welcome ul {
      list-style: none;
      padding: 0;
      margin-top: 10px;
    }

    #welcome li {
      margin: 6px 0;
      font-size: 16px;
      opacity: 0.8;
    }

    #chat-container {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      height: 70vh;
      overflow-y: auto;
      padding: 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }

    #chat-container::-webkit-scrollbar {
      width: 8px;
    }

    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: transparent;
    }

    #chat-input {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 600px;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
    }

    #chat-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <div id="welcome">
    <h2>What brings you in today?</h2>
    <ul id="suggestions"></ul>
  </div>

  <div id="chat-container"></div>
  <input id="chat-input" type="text" placeholder="Ask Blitz AI something..." />

  <script>
    const chatContainer = document.getElementById("chat-container");
    const chatInput = document.getElementById("chat-input");

    const suggestions = [
      "How can I help you feel more focused today?",
      "Need help solving a tricky problem?",
      "Want to talk through a creative idea?",
      "Looking for a cozy chat?",
      "Need a boost of motivation?",
      "Want to explore something new?"
    ];

    function showSuggestions() {
      const shuffled = suggestions.sort(() => 0.5 - Math.random());
      const topThree = shuffled.slice(0, 3);
      const list = document.getElementById("suggestions");
      list.innerHTML = "";
      topThree.forEach(text => {
        const li = document.createElement("li");
        li.textContent = text;
        list.appendChild(li);
      });
    }

    showSuggestions();

    chatInput.addEventListener("keydown", async (e) => {
      if (e.key === "Enter" && chatInput.value.trim()) {
        const prompt = chatInput.value.trim();
        appendMessage("You", prompt);
        chatInput.value = "";

        console.log("Sending prompt:", prompt);

        try {
          const res = await fetch("https://your-proxy-url/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });

          if (!res.ok) {
            throw new Error(`Server error: ${res.status}`);
          }

          const data = await res.json();
          console.log("Received response:", data);
          appendMessage("Blitz AI", data.reply);
        } catch (err) {
          console.error("Fetch error:", err);
          appendMessage("Blitz AI", "⚠️ Error reaching the server.");
        }
      }
    });

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msg.style.marginBottom = "12px";
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
